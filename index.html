<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vector favicon: crisp at every size and its ink follows the OS theme (see the
         media query inside the file). The JPEG stays as the fallback for browsers that
         don't accept SVG icons, and as the Apple touch icon, which must be a raster. -->
    <link rel="icon" type="image/svg+xml" href="/brand/emblem.svg" />
    <link rel="icon" type="image/jpeg" href="/brand/emblem.jpeg" />
    <link rel="apple-touch-icon" href="/brand/emblem.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarCarePlus — لوحة التحكم</title>
    <!-- Arabic-first UI fonts (Cairo + Tajawal). Without these, Arabic falls back to
         inconsistent system fonts (the "?????" name issue). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
